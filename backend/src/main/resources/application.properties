# ===========================
# Shishu-Sneh Application
# ===========================
spring.application.name=shishu-sneh

# ===========================
# H2 Database Configuration
# ===========================
spring.datasource.url=jdbc:h2:file:./data/shishusneh-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep data between restarts (file-based H2)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Console for debugging (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# Gemini API Configuration
# ===========================
gemini.api.key=${GEMINI_API_KEY:your-api-key-here}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# ===========================
# Server Configuration
# ===========================
server.port=8080
