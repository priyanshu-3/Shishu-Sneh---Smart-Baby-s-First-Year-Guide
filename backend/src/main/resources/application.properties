# ===========================
# Shishu-Sneh Application
# ===========================
spring.application.name=shishu-sneh

# ===========================
# Database Configuration (H2 Local / Postgres Prod)
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shishusneh-db}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Keep data between restarts (file-based H2) or update schema in prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console for debugging (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# Gemini API Configuration
# ===========================
gemini.api.key=${GEMINI_API_KEY:AIzaSyBX3B30QPtT8OVAxxJlDdUrnlFofhDUeOc}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ===========================
# Server Configuration
# ===========================
server.port=${PORT:8080}
