# ================================================
# Shishu-Sneh — Supabase (Production) Profile
# ================================================
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=supabase
# Or set env: SPRING_PROFILES_ACTIVE=supabase

# ===========================
# Supabase PostgreSQL
# ===========================
spring.datasource.url=jdbc:postgresql://db.usyqakkrdghaawcumejy.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console in production
spring.h2.console.enabled=false

# ===========================
# Supabase API Keys (env vars)
# ===========================
supabase.url=https://usyqakkrdghaawcumejy.supabase.co
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
