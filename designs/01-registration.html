<body class="bg-surface text-on-surface font-sans antialiased min-h-screen flex flex-col">
<!-- Hero Section -->
<div class="relative bg-gradient-to-b from-primary-container to-surface-variant pt-12 pb-24 px-margin-mobile flex flex-col items-center text-center overflow-hidden">
<!-- Abstract Decoration -->
<div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white via-transparent to-transparent mix-blend-overlay"></div>
<!-- Illustration -->
<div class="relative w-48 h-48 mb-6 z-10">
<img alt="Mother and baby illustration" class="w-full h-full object-cover rounded-full shadow-[0_8px_32px_rgba(232,116,97,0.3)] border-4 border-white/50" data-alt="A highly minimal, abstract digital illustration of a mother gently cradling a newborn baby. The artwork uses a sophisticated palette of soft, warm coral and peach gradients set against a clean, light-mode background. The composition relies on smooth, flowing lines and soft vector shapes, conveying a deep sense of maternal warmth, 'Sneh' (affection), and calm reliability without realistic details." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBlw7F7sJWTDNaDdyStzUl_9vRaQruoTvCwtnKUPrdRoZyp2PFQ_-kekr4SzpShWhjC2FegiziRjA23zTv0xzBxAsNs_AkRiMCjDrYoIAl2Q5ShwXTTE1BKs7M4W28MSfAugFwIjaqt6gOSVplHAojsoI56h1eSTqJ58Y-PRHTNasc1NfslLC2PFKvI65nlr4kMSsnnOWUz7YamLXeI7rRXCEa-AA4IThV6YsyK24mGgslPgv3kWbP_uZw0q8hB6L8ctxnZxP0mCno"/>
</div>
<!-- Brand Typography -->
<div class="relative z-10">
<h1 class="text-headline-lg font-headline-lg text-white mb-2 drop-shadow-sm">Shishu-Sneh</h1>
<p class="text-body-lg font-body-lg text-white/90 font-medium tracking-wide">Your baby's first year companion</p>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile -mt-16 pb-12 z-20">
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-[0_12px_40px_-12px_rgba(161,62,47,0.15)] p-6 sm:p-8 w-full max-w-md mx-auto">
<div class="mb-8">
<h2 class="text-headline-sm font-headline-sm text-on-surface mb-1">Welcome!</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Let's set up your baby's profile.</p>
</div>
<form class="space-y-6">
<!-- Input: Baby's Name -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="baby-name">Baby's Full Name</label>
<input class="w-full min-h-[56px] bg-surface-container border border-outline-variant rounded-xl px-4 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="baby-name" placeholder="Enter name" type="text"/>
</div>
<!-- Input: Date of Birth -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="dob">Date of Birth</label>
<div class="relative">
<input class="w-full min-h-[56px] bg-surface-container border border-outline-variant rounded-xl pl-4 pr-12 text-body-md font-body-md text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none appearance-none" id="dob" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">calendar_month</span>
</div>
</div>
<!-- Input Grid: Weight & Gender -->
<div class="grid grid-cols-2 gap-4">
<!-- Input: Birth Weight -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="weight">Birth Weight</label>
<div class="relative">
<input class="w-full min-h-[56px] bg-surface-container border border-outline-variant rounded-xl pl-4 pr-12 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none" id="weight" placeholder="0.00" step="0.01" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-body-md font-body-md text-on-surface-variant font-medium">kg</span>
</div>
</div>
<!-- Input: Gender Select -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="gender">Gender</label>
<div class="relative">
<select class="w-full min-h-[56px] bg-surface-container border border-outline-variant rounded-xl pl-4 pr-10 text-body-md font-body-md text-on-surface focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none appearance-none" id="gender">
<option disabled="" selected="" value="">Select</option>
<option value="boy">Boy</option>
<option value="girl">Girl</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full min-h-[56px] bg-gradient-to-r from-primary-container to-primary text-white rounded-full flex items-center justify-center text-[18px] font-bold shadow-[0_4px_14px_rgba(232,116,97,0.4)] active:scale-[0.98] transition-transform" type="button">
                        Complete Profile
                    </button>
<a class="text-center text-body-md font-body-md text-primary font-medium hover:text-primary-container transition-colors" href="#">
                        Already registered? View Profile
                    </a>
</div>
</form>
</div>
</main>
</body></html>
